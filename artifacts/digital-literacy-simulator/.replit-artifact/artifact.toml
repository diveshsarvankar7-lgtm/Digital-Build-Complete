kind = "web"
previewPath = "/"
title = "Digital Literacy Simulator"
description = "An approachable smartphone practice simulator for older adults, with an authentic virtual phone, automatic task completion, multilingual guidance, and a facilitator analytics view."
version = "1.0.0"
id = "artifacts/digital-literacy-simulator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21450

[services.development]
run = "pnpm --filter @workspace/digital-literacy-simulator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-literacy-simulator", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-literacy-simulator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21450"
BASE_PATH = "/"
